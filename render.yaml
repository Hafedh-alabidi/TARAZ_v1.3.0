# ============================================================
# طراز TARAZ v1.3.0 — مخطط النشر على Render (Blueprint)
# ============================================================
# النشر بخطوة واحدة: Render Dashboard → New → Blueprint → اختر المستودع
#
# البنية:
#   1) taraz-db    : قاعدة بيانات PostgreSQL (خطة مجانية — صلاحية 90 يوماً)
#   2) hafedh-taraz-api    : خادم Django API (gunicorn + whitenoise)
#   3) hafedh-taraz-pos    : تطبيق الإدارة/نقطة البيع (موقع ثابت React)
#   4) hafedh-taraz-market : واجهة المتجر للزبائن (موقع ثابت React)
#
# ⚠️ إن ظهر تعارض بأسماء الخدمات (مأخوذة من مستخدم آخر على onrender.com)
#    غيّر الأسماء هنا وحدّث الروابط في: VITE_API_URL و CORS_ALLOWED_ORIGINS
#    و CSRF_TRUSTED_ORIGINS و ALLOWED_HOSTS أدناه.
# ============================================================

databases:
  - name: hafedh-taraz-db
    databaseName: taraz
    user: taraz
    plan: free
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------
  # 1) خادم الـ API — Django + DRF + gunicorn + whitenoise
  # ----------------------------------------------------------
  - type: web
    name: hafedh-taraz-api
    runtime: python
    plan: free
    rootDir: taraz_backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn taraz_backend.wsgi:application
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: WEB_CONCURRENCY
        value: "2"
      # --- قاعدة البيانات (تُملأ تلقائياً من hafedh-taraz-db) ---
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: hafedh-taraz-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: hafedh-taraz-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hafedh-taraz-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: hafedh-taraz-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hafedh-taraz-db
          property: port
      # --- الأمان ---
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: ALLOWED_HOSTS
        value: hafedh-taraz-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://hafedh-taraz-pos.onrender.com,https://hafedh-taraz-market.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hafedh-taraz-api.onrender.com,https://hafedh-taraz-pos.onrender.com,https://hafedh-taraz-market.onrender.com
      # --- بوابة الدفع: محاكاة للتدريب (غيّها إلى moyasar عند الإطلاق الحقيقي) ---
      - key: TARAZ_PAYMENT_PROVIDER
        value: simulated

  # ----------------------------------------------------------
  # 2) تطبيق الإدارة / نقطة البيع — React (موقع ثابت مجاني دائم)
  # ----------------------------------------------------------
  - type: web
    name: hafedh-taraz-pos
    runtime: static
    plan: free
    rootDir: taraz_desktop
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # النشر على جذر النطاق (بدل /pos/ المستخدم في المعاينة)
      - key: VITE_BASE
        value: /
      # رابط الـ API الكامل (بما فيه /api)
      - key: VITE_API_URL
        value: https://hafedh-taraz-api.onrender.com/api
    routes:
      # توجيه كل المسارات إلى تطبيق الصفحة الواحدة (React Router)
      - type: rewrite
        source: /*
        destination: /index.html

  # ----------------------------------------------------------
  # 3) واجهة المتجر للزبائن — React (موقع ثابت مجاني دائم)
  # ----------------------------------------------------------
  - type: web
    name: hafedh-taraz-market
    runtime: static
    plan: free
    rootDir: taraz_marketplace
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://hafedh-taraz-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
