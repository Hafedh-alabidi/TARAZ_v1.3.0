# ============================================================
# إعدادات nginx لخدمة تطبيقات React مع توجيه الـ API
#
# ✅ أمن: قالب TLS جاهز — عند الحصول على الشهادات:
#   1) أنشئ مجلد ./certs وضع fullchain.pem و privkey.pem فيه
#   2) فعّل بلوك HTTPS (أزل التعليق) وبلوك إعادة التوجيه
#   3) فعّل منفذ 443 ومجلد الشهادات في docker-compose.yml
#   4) اجعل SECURE_SSL_REDIRECT=True في .env
# ============================================================

# ---------------- HTTP (التطوير أو قبل تفعيل الشهادات) ----------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # حجم أقصى معقول لأجسام الطلبات (JSON الطلبات والصور)
    client_max_body_size 10m;

    # ضغط
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # الأصول الثابتة بتخزين مؤقت طويل
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # توجيه الـ API إلى خادم Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ملفات Django الثابتة والوسائط
    location /static/ {
        proxy_pass http://backend:8000;
    }
    location /media/ {
        proxy_pass http://backend:8000;
    }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — كل المسارات إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # أمان
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

